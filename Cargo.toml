# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "resend-rs"
version = "0.29.0"
edition = "2024"

license = "MIT"
readme = "./README.md"

authors = ["Antonios Barotsis <antonios.barotsis@proton.me>"]
repository = "https://github.com/resend/resend-rust"
homepage = "https://resend.com/docs/send-with-rust"
documentation = "https://docs.rs/resend-rs"

categories = ["email", "web-programming"]
keywords = ["email", "resend"]
description = "Resend's Official Rust SDK."

[features]
default = ["native-tls"]

blocking = ["reqwest/blocking", "maybe-async/is_sync"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls"]

# Lint policy for this package.
#
# This previously lived in `.cargo/config.toml` as `[target.'cfg(all())'] rustflags`.
# That location has two problems: Cargo silently ignores config-file rustflags whenever
# the `RUSTFLAGS` environment variable is set (so the policy could vanish with no
# warning), and the flags were applied to every dependency as well as this crate.
# The `[lints]` table is scoped to this package and cannot be clobbered by the
# environment.
#
# Lint groups carry `priority = -1` so that the individual entries below them win.

[lints.rust]
unsafe_code = "forbid"

future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

absolute_paths_not_starting_with_crate = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
noop_method_call = "warn"
rust_2021_incompatible_closure_captures = "warn"
rust_2021_incompatible_or_patterns = "warn"
rust_2021_prefixes_incompatible_syntax = "warn"
rust_2021_prelude_collisions = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

ambiguous_glob_reexports = "deny"
clashing_extern_declarations = "deny"
const_item_mutation = "deny"
dangling_pointers_from_temporaries = "deny"
deref_nullptr = "deny"
drop_bounds = "deny"
hidden_glob_reexports = "deny"
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
invalid_from_utf8 = "deny"
invalid_macro_export_arguments = "deny"
invalid_nan_comparisons = "deny"
invalid_reference_casting = "deny"
invalid_value = "deny"
opaque_hidden_inferred_bound = "deny"
overlapping_range_endpoints = "deny"
suspicious_double_ref_op = "deny"
unconditional_recursion = "deny"
unexpected_cfgs = "deny"
unnameable_test_items = "deny"
unsafe_op_in_unsafe_fn = "deny"
unstable_syntax_pre_expansion = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

await_holding_lock = "warn"
bool_to_int_with_if = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
indexing_slicing = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_unit_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_range_contains = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
match_like_matches_macro = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
missing_enforced_import_renames = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_doctest_main = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
similar_names = "warn"
single_match_else = "warn"
string_lit_as_bytes = "warn"
trait_duplication_in_bounds = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
unwrap_or_default = "warn"
unwrap_used = "warn"
useless_transmute = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

missing_const_for_fn = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
string_add = "allow"
string_add_assign = "allow"
# The public API deliberately takes owned options structs by value; see
# https://github.com/resend/resend-rust/pull/1#issuecomment-2081646115
# This was previously suppressed with 68 individual `#[allow]` attributes.
needless_pass_by_value = "allow"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
  "http2",
  "multipart",
] }
serde = { version = "1.0", features = ["derive"] }
ecow = { version = "0.3.0", features = ["serde"] }
thiserror = { version = "2.0" }
maybe-async = { version = "0.2.11" }
governor = "0.10.4"
rand = "0.10.2"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde_json = "1.0.150"
mailparse = "0.16.1"
urlencoding = "2.1.3"

[dev-dependencies]
jiff = { version = "0.2.31", features = ["serde"] }
tokio = { version = "1.52.3", features = [
  "macros",
  "test-util",
  "rt-multi-thread",
] }
strum = { version = "0.28", features = ["derive"] }
scraper = "0.27.0"
regex = "1.12.4"
# Used in examples
axum = "0.8.9"
svix = "1.96.1"
http-body-util = "0.1.3"
tokio-shared-rt = "0.1.0"
anyhow = "1.0"
